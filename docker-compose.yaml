services:
  treinroulette:
    build:
      context: .
    image: treinroulette:latest
    container_name: treinroulette
    restart: unless-stopped
    ports:
      - "8031:3000"
    environment:
      NS_API_KEY: ${NS_API_KEY:-}
    volumes:
      - treinroulette_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  treinroulette_data:
